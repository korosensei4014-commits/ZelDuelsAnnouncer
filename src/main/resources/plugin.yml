name: ZelDuelsAnnouncer
version: '${version}'
main: com.korosensei.zelduelsannouncer.ZelDuelsAnnouncer
api-version: '26.1'
author: korosensei4014-commits
description: Announces ZelDuels results in chat.
softdepend:
  - ZelDuels

commands:
  zdannouncer:
    description: ZelDuelsAnnouncer admin command.
    usage: /zdannouncer reload
    aliases: [zdannounce]
    permission: zelduelsannouncer.admin

permissions:
  zelduelsannouncer.admin:
    description: Allows reloading the ZelDuelsAnnouncer config.
    default: op
